<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14141f">
<title>Рублёвка</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html, body { height:100%; overflow:hidden; font-family:-apple-system,Roboto,sans-serif; touch-action:manipulation; }
body { background: radial-gradient(ellipse at 50% 20%, #232340 0%, #14141f 70%); color:#fff; }

.auth { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:24px; }
.auth-logo { font-size:72px; margin-bottom:12px; }
.auth-title { font-size:28px; font-weight:800; margin-bottom:6px; color:#ffd75e; }
.auth-sub { color:#8888aa; font-size:14px; margin-bottom:26px; text-align:center; }
.auth-input { width:100%; max-width:340px; padding:14px 16px; margin-bottom:12px;
  background:#242f3d; border:1px solid #2a2a44; border-radius:12px; color:#fff;
  font-size:16px; outline:none; font-family:inherit; }
.auth-input::placeholder { color:#708499; }
.auth-input:focus { border-color:#4a5cf5; }
.auth-btn { width:100%; max-width:340px; padding:15px; margin-top:8px;
  background:linear-gradient(180deg,#4a5cf5,#3a48d0); color:#fff; border:none;
  border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; }
.auth-btn:active { background:linear-gradient(180deg,#3f50d8,#3038b8); }
.auth-btn:disabled { opacity:.6; cursor:not-allowed; }
.auth-err { color:#e17076; margin-top:12px; font-size:14px; min-height:18px; text-align:center; max-width:340px; }
.auth-switch { margin-top:20px; color:#4a5cf5; cursor:pointer; font-size:14px; font-weight:600; }

.game { display:none; flex-direction:column; height:100%; }
.game.active { display:flex; }

.hud { padding:18px 20px 6px; text-align:center; position:relative; }
.hud .user { position:absolute; top:14px; left:16px; font-size:13px; color:#8888aa; }
.hud .user b { color:#ffd75e; }
.hud .logout { position:absolute; top:12px; right:14px; color:#8888aa; font-size:20px; cursor:pointer; padding:4px 8px; }
.balance { font-size:36px; font-weight:800; letter-spacing:.5px; color:#ffd75e;
  text-shadow: 0 2px 10px rgba(255,200,60,.35); }
.balance .ruble { font-size:30px; margin-right:4px; opacity:.9; }
.cps { margin-top:4px; color:#8888aa; font-size:14px; }

.coin-area { flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; perspective:1200px; padding:10px; position:relative; }
.coin-wrap { width:230px; height:230px; display:flex; align-items:center; justify-content:center; }
.coin { width:210px; height:210px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; cursor:pointer; transform-style:preserve-3d;
  background: radial-gradient(circle at 32% 28%, var(--c1,#b07a4a), var(--c2,#6d4525) 62%, var(--c3,#3a2410) 100%);
  box-shadow: inset 0 -8px 20px rgba(0,0,0,.4), inset 0 6px 14px rgba(255,255,255,.15),
              0 10px 28px rgba(0,0,0,.6), 0 0 0 5px var(--ring,#5a3a1a),
              0 0 var(--glow,0) var(--glow-color,transparent);
  position:relative; overflow:hidden; will-change:transform; transition: box-shadow .3s; }
.coin::before { content:"₽"; position:absolute; font-size:96px; font-weight:900;
  color: rgba(255,255,255,var(--sym,.18)); text-shadow: 0 3px 8px rgba(0,0,0,.4);
  font-family: Georgia, serif; pointer-events:none; transition: color .3s; }
.coin::after { content:""; position:absolute; top:8%; left:15%; width:70%; height:40%;
  background: linear-gradient(180deg, rgba(255,255,255,var(--hl,.35)), rgba(255,255,255,0));
  border-radius:50%; filter:blur(4px); pointer-events:none; }
.coin.rainbow { background: conic-gradient(from 0deg, #ff5577, #ffaa33, #ffee55,
  #55ee88, #55bbff, #aa66ff, #ff5577) !important;
  --glow-color:#ffcc55; --glow:50px; --sym:.5; --hl:.5;
  animation: rainbow-glow 2.5s ease-in-out infinite; }
@keyframes rainbow-glow { 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.3);} }
.coin.tapping { animation: tap-coin .5s cubic-bezier(.4,0,.2,1); }
@keyframes tap-coin {
  0%   { transform: scale(1) rotateY(0deg); }
  20%  { transform: scale(.88) rotateY(90deg); }
  55%  { transform: scale(.94) rotateY(200deg); }
  80%  { transform: scale(1.06) rotateY(340deg); }
  100% { transform: scale(1) rotateY(360deg); }
}
.level-info { margin-top:20px; text-align:center; }
.level-text { font-size:16px; font-weight:600; color:#ccd; }
.level-text .num { color:#ffd75e; }
.progress-bar { width:220px; height:6px; background:#2a2a40; border-radius:3px;
  margin:8px auto 0; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,#ff9040,#ffd75e);
  width:0%; border-radius:3px; transition:width .3s; }
.float { position:absolute; color:#ffd75e; font-weight:800; font-size:26px;
  pointer-events:none; animation: float-up .9s ease-out forwards;
  text-shadow: 0 2px 10px rgba(255,215,90,.7), 0 0 4px #000; z-index:20; }
@keyframes float-up {
  0%   { opacity:1; transform: translate(-50%,0) scale(.6); }
  20%  { transform: translate(-50%,-10px) scale(1.15); }
  100% { opacity:0; transform: translate(-50%,-90px) scale(1.1); }
}
.shop-btn-wrap { padding:10px 16px 16px; flex-shrink:0; }
.shop-btn { width:100%; padding:16px; background:linear-gradient(180deg,#4a5cf5,#3a48d0);
  border:none; border-radius:16px; color:#fff; font-size:17px; font-weight:700;
  font-family:inherit; cursor:pointer; box-shadow: 0 6px 18px rgba(74,92,245,.4);
  position:relative; touch-action:manipulation; }
.shop-btn:active { transform:scale(.98); }
.shop-btn .badge { position:absolute; top:-6px; right:-6px; background:#ff3b30;
  color:#fff; font-size:13px; padding:2px 8px; border-radius:11px; font-weight:700; }

.union-btn { position:fixed; top:50%; left:0; transform:translateY(-50%);
  background:linear-gradient(180deg,#4a5cf5,#3a48d0); color:#fff;
  padding:14px 8px; border-radius:0 14px 14px 0; cursor:pointer;
  font-weight:700; font-size:13px; writing-mode: vertical-rl; text-orientation: mixed;
  box-shadow: 4px 0 14px rgba(74,92,245,.4); z-index:50;
  display:none; flex-direction:column; align-items:center; gap:6px;
  letter-spacing:2px; }
.union-btn.active { display:flex; }
.union-btn:active { background:linear-gradient(180deg,#3f50d8,#3038b8); }
.union-btn .shield { font-size:18px; writing-mode: horizontal-tb; }

.union-search { width:100%; padding:12px 14px; background:#252540;
  border:1px solid #3a3a55; border-radius:12px; color:#fff; font-size:15px;
  outline:none; font-family:inherit; margin-bottom:12px; }
.union-search::placeholder { color:#708499; }

.union-create-btn { width:100%; padding:13px; margin-bottom:12px;
  background:linear-gradient(180deg,#4a5cf5,#3a48d0); border:none;
  border-radius:12px; color:#fff; font-size:15px; font-weight:700;
  cursor:pointer; font-family:inherit; }
.union-create-btn:active { background:linear-gradient(180deg,#3f50d8,#3038b8); }

.union-row { display:flex; align-items:center; padding:12px 10px; gap:12px;
  border-bottom:1px solid #2a2a44; cursor:pointer; border-radius:10px; }
.union-row:active { background:#252540; }
.union-tag { width:44px; height:44px; border-radius:10px; display:flex;
  align-items:center; justify-content:center; font-weight:800; font-size:13px;
  color:#fff; flex-shrink:0; letter-spacing:1px; }
.union-body { flex:1; min-width:0; }
.union-name { font-weight:600; font-size:15px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.union-desc { color:#8888aa; font-size:12px; margin-top:2px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.union-members { color:#ffd75e; font-weight:700; font-size:13px;
  text-align:right; flex-shrink:0; }
.union-badge { background:#2a8f4a; color:#fff; font-size:10px; font-weight:700;
  padding:2px 8px; border-radius:10px; margin-left:6px; }

.union-info-head { display:flex; flex-direction:column; align-items:center;
  padding:6px 0 14px; gap:8px; }
.union-info-tag { width:80px; height:80px; border-radius:18px;
  display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:800; color:#fff; letter-spacing:1px; }
.union-info-name { font-size:20px; font-weight:700; text-align:center; }
.union-info-desc { color:#8888aa; font-size:13px; text-align:center; padding:0 10px; }
.union-members-list { max-height:280px; overflow-y:auto; margin-top:8px; }

.union-action { width:100%; padding:13px; border:none; border-radius:12px;
  font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
  margin-top:12px; }
.union-action.join { background:linear-gradient(180deg,#2a8f4a,#227a3f); color:#fff; }
.union-action.leave { background:linear-gradient(180deg,#8f2a2a,#7a2323); color:#fff; }
.union-action:active { transform:scale(.98); }

.top-btn { position:fixed; top:50%; right:0; transform:translateY(-50%);
  background:linear-gradient(180deg,#ffb020,#e89010); color:#fff;
  padding:14px 8px; border-radius:14px 0 0 14px; cursor:pointer;
  font-weight:700; font-size:13px; writing-mode: vertical-rl; text-orientation: mixed;
  box-shadow: -4px 0 14px rgba(255,180,40,.4); z-index:50;
  display:none; flex-direction:column; align-items:center; gap:6px;
  letter-spacing:2px; }
.top-btn.active { display:flex; }
.top-btn:active { background:linear-gradient(180deg,#e8a010,#c88008); }
.top-btn .trophy { font-size:18px; writing-mode: horizontal-tb; }

.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex;
  align-items:center; justify-content:center; z-index:100; padding:16px; animation: fade .2s; }
@keyframes fade { from{opacity:0} to{opacity:1} }
@keyframes slide-up { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-sheet { width:100%; max-width:480px; background:#1c1c2e; border-radius:20px;
  padding:20px 18px; animation: fade .2s; max-height:82vh; overflow-y:auto;
  -webkit-overflow-scrolling:touch; position:relative; }
.modal-sheet.bottom { border-radius:22px 22px 0 0; align-self:flex-end;
  animation: slide-up .25s ease-out; }
.modal-sheet h3 { text-align:center; font-size:19px; margin-bottom:16px; color:#ffd75e; }
.modal-close { position:absolute; top:14px; right:16px; font-size:26px; color:#8888aa;
  cursor:pointer; line-height:1; }

.up-row { display:flex; align-items:center; padding:12px; background:#252540;
  border-radius:14px; margin-bottom:10px; gap:12px; cursor:pointer;
  transition: transform .1s, background .15s, opacity .2s;
  border:1px solid #2a2a44; touch-action:manipulation; }
.up-row:active:not(.disabled) { transform: scale(.97); background:#2d2d4a; }
.up-row.disabled { opacity:.45; cursor:not-allowed; }
.up-row.flash { background:#2d5a3a; border-color:#4a8f5a; }
.up-row * { pointer-events: none; }
.up-row .up-icon { width:48px; height:48px; border-radius:12px; display:flex;
  align-items:center; justify-content:center; font-size:24px; flex-shrink:0;
  background:linear-gradient(135deg,#3a3a66,#252545); }
.up-row .up-body { flex:1; min-width:0; }
.up-row .up-name { font-size:15px; font-weight:600; }
.up-row .up-desc { font-size:12px; color:#8888aa; margin-top:2px; }
.up-row .up-lvl { font-size:11px; color:#ffd75e; margin-top:2px; }
.up-row .up-cost { font-size:14px; font-weight:700; color:#ffd75e; text-align:right; flex-shrink:0; }
.up-row .up-cost.off { color:#e17076; }

.top-row { display:flex; align-items:center; padding:12px 10px; gap:12px;
  border-bottom:1px solid #2a2a44; cursor:pointer; border-radius:10px; }
.top-row:active { background:#252540; }
.top-row .place { width:32px; font-size:16px; font-weight:800; text-align:center;
  color:#8888aa; flex-shrink:0; }
.top-row .place.gold { color:#ffd75e; }
.top-row .place.silver { color:#c8c8d0; }
.top-row .place.bronze { color:#cd7f32; }
.top-row .t-avatar { width:40px; height:40px; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-weight:700; font-size:16px;
  color:#fff; flex-shrink:0; }
.top-row .t-body { flex:1; min-width:0; }
.top-row .t-name { font-weight:600; font-size:15px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.top-row .t-sub { color:#8888aa; font-size:12px; margin-top:2px; }
.top-row .t-coins { color:#ffd75e; font-weight:700; font-size:14px;
  text-align:right; flex-shrink:0; }

.profile-head { display:flex; flex-direction:column; align-items:center;
  padding:8px 0 16px; gap:8px; }
.profile-head .p-avatar { width:80px; height:80px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:32px; font-weight:800; color:#fff; }
.profile-head .p-name { font-size:20px; font-weight:700; }
.profile-head .p-sub { color:#8888aa; font-size:13px; }

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
.stat-box { background:#252540; border-radius:12px; padding:12px; text-align:center;
  border:1px solid #2a2a44; }
.stat-box .s-val { font-size:18px; font-weight:800; color:#ffd75e; margin-bottom:2px; }
.stat-box .s-label { font-size:11px; color:#8888aa; text-transform:uppercase;
  letter-spacing:.5px; }

.loading { text-align:center; color:#8888aa; padding:20px; }

.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
  background:#2a2a44; padding:10px 18px; border-radius:20px; font-size:13px;
  color:#fff; opacity:0; transition:opacity .3s; pointer-events:none; z-index:300; }
.toast.show { opacity:1; }
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:#4a4a6a; border-radius:2px; }

/* BROADCAST */
.broadcast-banner { position:fixed; top:0; left:0; right:0; z-index:200;
  background:linear-gradient(90deg,#8f2a2a,#b02828,#8f2a2a); color:#fff;
  padding:14px 44px 14px 16px; font-size:14px; font-weight:600;
  box-shadow:0 4px 20px rgba(180,40,40,.5);
  display:none; align-items:center; gap:10px; }
.broadcast-banner.show { display:flex; }
.broadcast-banner .b-icon { font-size:20px; flex-shrink:0; }
.broadcast-banner .b-text { flex:1; word-break:break-word; }
.broadcast-banner .b-close { position:absolute; right:10px; top:50%;
  transform:translateY(-50%); cursor:pointer; font-size:22px;
  color:rgba(255,255,255,.7); padding:4px 10px; }

/* CASINO BUTTON */
.casino-btn { position:fixed; bottom:90px; right:16px; z-index:60;
  width:60px; height:60px; border-radius:50%;
  background:linear-gradient(135deg,#d4262a,#8f1015); border:none;
  color:#fff; font-size:28px; cursor:pointer;
  box-shadow: 0 6px 20px rgba(212,38,42,.6), inset 0 -3px 8px rgba(0,0,0,.3);
  display:none; align-items:center; justify-content:center;
  padding:0; font-family:inherit; }
.casino-btn.active { display:flex !important; }
.casino-btn:active { transform:scale(.92); }

/* SHOP TABS */
.shop-tabs { display:flex; gap:8px; margin-bottom:14px;
  background:#15152a; border-radius:12px; padding:4px; }
.shop-tab { flex:1; text-align:center; padding:10px; border-radius:9px;
  cursor:pointer; font-weight:600; font-size:14px; color:#8888aa;
  transition:all .15s; }
.shop-tab.active { background:linear-gradient(180deg,#4a5cf5,#3a48d0);
  color:#fff; box-shadow:0 3px 10px rgba(74,92,245,.4); }

/* SKINS */
.skins-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.skin-card { background:#252540; border:2px solid #2a2a44; border-radius:14px;
  padding:12px; text-align:center; cursor:pointer; transition:all .15s; }
.skin-card:active { transform:scale(.97); }
.skin-card.owned { border-color:#2a8f4a; }
.skin-card.selected { border-color:#4a5cf5;
  box-shadow:0 0 12px rgba(74,92,245,.5) inset; }
.skin-preview { width:56px; height:56px; border-radius:50%; margin:0 auto 8px;
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:900; color:rgba(255,255,255,.8);
  box-shadow: inset 0 -3px 8px rgba(0,0,0,.4), inset 0 2px 6px rgba(255,255,255,.2); }
.skin-name { font-size:13px; font-weight:600; margin-bottom:4px; }
.skin-price { font-size:12px; color:#ffd75e; font-weight:700; }
.skin-price.owned-tag { color:#4ac864; }
.skin-price.selected-tag { color:#4a5cf5; }
.skin-preview.skin-classic { background: radial-gradient(circle at 32% 28%, #d8d8d8, #909090 62%, #505050); }
.skin-preview.skin-silver  { background: radial-gradient(circle at 32% 28%, #f8f8ff, #c0c0d0 62%, #808090); }
.skin-preview.skin-gold    { background: radial-gradient(circle at 32% 28%, #ffe880, #e0b020 62%, #906010); }
.skin-preview.skin-emerald { background: radial-gradient(circle at 32% 28%, #80ffb0, #20b060 62%, #105030); }
.skin-preview.skin-ruby    { background: radial-gradient(circle at 32% 28%, #ff8090, #d02040 62%, #800020); }
.skin-preview.skin-diamond { background: radial-gradient(circle at 32% 28%, #ffffff, #80d8ff 62%, #4090c0); }
.skin-preview.skin-neon    { background: radial-gradient(circle at 32% 28%, #ff80ff, #a020c0 62%, #500060); }
.skin-preview.skin-fire    { background: radial-gradient(circle at 32% 28%, #ffdd80, #ff5500 62%, #802000); }
.skin-preview.skin-ice     { background: radial-gradient(circle at 32% 28%, #e0ffff, #80d0ff 62%, #305090); }
.skin-preview.skin-cosmic  { background: radial-gradient(circle at 32% 28%, #8080ff, #4020a0 62%, #100030); }
.skin-preview.skin-rainbow { background: conic-gradient(from 0deg,#ff5577,#ffaa33,#ffee55,#55ee88,#55bbff,#aa66ff,#ff5577); }

/* CASINO MODAL */
.casino-modal { width:100%; max-width:420px; background:#1c1c2e;
  border-radius:22px; padding:20px 18px; }
.casino-modal h3 { text-align:center; font-size:22px; margin-bottom:14px;
  color:#ffd75e; letter-spacing:1px; }
.casino-balance { text-align:center; font-size:14px; color:#8888aa; margin-bottom:14px; }
.casino-balance b { color:#ffd75e; }
.casino-tabs { display:flex; gap:8px; margin-bottom:14px;
  background:#15152a; border-radius:12px; padding:4px; }
.casino-tab { flex:1; text-align:center; padding:10px; border-radius:9px;
  cursor:pointer; font-weight:600; font-size:14px; color:#8888aa; }
.casino-tab.active { background:linear-gradient(180deg,#d4262a,#8f1015); color:#fff; }
.casino-section { display:none; }
.casino-section.active { display:block; }
.casino-input { width:100%; padding:14px; background:#252540;
  border:1px solid #3a3a55; border-radius:12px; color:#fff;
  font-size:16px; outline:none; font-family:inherit; margin-bottom:12px; text-align:center; }
.casino-quick { display:flex; gap:6px; margin-bottom:12px; }
.casino-quick button { flex:1; padding:10px 4px; background:#252540;
  border:1px solid #3a3a55; border-radius:10px; color:#fff;
  font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
.casino-action { width:100%; padding:14px; border:none; border-radius:12px;
  font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;
  color:#fff; margin-bottom:8px; }
.casino-action.coin { background:linear-gradient(180deg,#ffb020,#e89010); }
.casino-action.flip { background:linear-gradient(180deg,#4a5cf5,#3a48d0); }
.casino-result { text-align:center; padding:16px; margin-top:8px;
  border-radius:12px; font-size:15px; font-weight:700; display:none; }
.casino-result.win { background:#2a8f4a; color:#fff; }
.casino-result.lose { background:#8f2a2a; color:#fff; }
.casino-coin { width:80px; height:80px; border-radius:50%; margin:10px auto;
  display:flex; align-items:center; justify-content:center;
  font-size:36px; font-weight:900; color:rgba(255,255,255,.85);
  background:radial-gradient(circle at 32% 28%,#ffe880,#e0b020 62%,#906010);
  box-shadow: inset 0 -4px 10px rgba(0,0,0,.4), inset 0 3px 8px rgba(255,255,255,.3);
  transition: transform .6s cubic-bezier(.4,0,.2,1); }
.casino-coin.flipping { animation: coinflip 1s ease-in-out; }
@keyframes coinflip {
  0% { transform: rotateY(0deg) scale(1); }
  50% { transform: rotateY(720deg) scale(1.1); }
  100% { transform: rotateY(1440deg) scale(1); }
}
.casino-dice { width:80px; height:80px; border-radius:16px; margin:10px auto;
  display:flex; align-items:center; justify-content:center;
  font-size:44px; background:#fff; color:#222;
  box-shadow: 0 6px 16px rgba(0,0,0,.5); }
.casino-dice.rolling { animation: diceroll .8s ease-out; }
@keyframes diceroll {
  0% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(90deg) scale(1.15); }
  50% { transform: rotate(180deg) scale(.95); }
  75% { transform: rotate(270deg) scale(1.1); }
  100% { transform: rotate(360deg) scale(1); }
}


/* ANIMATIONS */
@keyframes modalFadeIn { from{opacity:0;} to{opacity:1;} }
@keyframes modalPopIn { from{opacity:0; transform:scale(.9) translateY(20px);}
  to{opacity:1; transform:scale(1) translateY(0);} }
@keyframes modalSlideUp { from{opacity:0; transform:translateY(60px);}
  to{opacity:1; transform:translateY(0);} }
.modal-bg { animation: modalFadeIn .2s ease-out !important; }
.modal-sheet { animation: modalPopIn .3s cubic-bezier(.34,1.56,.64,1) !important; }
.modal-sheet.bottom { animation: modalSlideUp .3s cubic-bezier(.34,1.56,.64,1) !important; }
.casino-modal { animation: modalPopIn .3s cubic-bezier(.34,1.56,.64,1) !important; }
.union-row, .top-row, .up-row { animation: modalFadeIn .3s ease-out; }

/* PROFILE BANNERS */
.profile-banners { display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  margin:12px 0; padding:0 4px; }
.banner-slot { aspect-ratio:1; border-radius:12px; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:4px; cursor:pointer; position:relative;
  box-shadow: inset 0 -3px 8px rgba(0,0,0,.3), inset 0 2px 6px rgba(255,255,255,.15);
  transition: transform .15s; overflow:hidden; }
.banner-slot:active { transform:scale(.94); }
.banner-slot.empty { background:#1f1f35; border:2px dashed #3a3a55; }
.banner-slot.filled { color:#fff; font-weight:700; }
.banner-slot .b-emoji { font-size:26px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.banner-slot .b-label { font-size:10px; text-align:center; opacity:.9;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.banner-slot .b-del { position:absolute; top:2px; right:4px; font-size:14px;
  color:rgba(255,255,255,.7); cursor:pointer; line-height:1; }

/* KICK BUTTON */
.kick-btn { width:32px; height:32px; border-radius:50%; background:#8f2a2a;
  color:#fff; border:none; display:flex; align-items:center; justify-content:center;
  font-size:14px; cursor:pointer; flex-shrink:0; padding:0; font-family:inherit; }
.kick-btn:active { background:#b03030; transform:scale(.9); }

/* BANNER EDITOR */
.banner-editor-emoji { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;
  justify-content:center; }
.banner-editor-emoji button { width:44px; height:44px; border-radius:10px;
  background:#252540; border:2px solid #2a2a44; font-size:22px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0; }
.banner-editor-emoji button.active { border-color:#4a5cf5;
  background:#2d2d5a; box-shadow:0 0 10px rgba(74,92,245,.5); }
.banner-editor-color { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;
  justify-content:center; }
.banner-editor-color button { width:40px; height:40px; border-radius:50%;
  border:3px solid transparent; cursor:pointer; padding:0; }
.banner-editor-color button.active { border-color:#fff;
  box-shadow:0 0 12px rgba(255,255,255,.6); }

</style>
</head>
<body>

<div class="auth" id="authScreen">
  <div class="auth-logo">💰</div>
  <div class="auth-title">Рублёвка</div>
  <div class="auth-sub" id="authSub">Войди или создай аккаунт</div>
  <input class="auth-input" id="authUser" placeholder="Ник (без пробелов)" autocomplete="username" maxlength="20">
  <input class="auth-input" id="authPass" type="password" placeholder="Пароль" autocomplete="current-password">
  <button class="auth-btn" id="authBtn">Войти</button>
  <div class="auth-err" id="authErr"></div>
  <div class="auth-switch" id="authSwitch">Создать аккаунт</div>
</div>

<div class="game" id="gameScreen">
  <div class="hud" id="hud">
    <div class="user">👤 <b id="hudUser">...</b></div>
    <div class="logout" id="btnLogout">⏻</div>
    <div class="balance"><span class="ruble">₽</span><span id="coins">0</span></div>
    <div class="cps"><span id="cpsText">0</span> ₽/сек</div>
  </div>
  <div class="coin-area" id="coinArea">
    <div class="coin-wrap"><div class="coin" id="coin"></div></div>
    <div class="level-info">
      <div class="level-text">Уровень <span class="num" id="levelNum">1</span> / 120</div>
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>
  </div>
  <div class="shop-btn-wrap">
    <button class="shop-btn" id="btnShop">🛒 МАГАЗИН<span class="badge" id="shopBadge" style="display:none">!</span></button>
  </div>
</div>

<div class="union-btn" id="btnUnion">
  <div class="shield">🤝</div>
  <div>СОЮЗ</div>
</div>

<div class="top-btn" id="btnTop">
  <div class="trophy">🏆</div>
  <div>ТОП</div>
</div>

<div class="broadcast-banner" id="broadcastBanner">
  <div class="b-icon">📢</div>
  <div class="b-text" id="broadcastText"></div>
  <div class="b-close" id="broadcastClose">×</div>
</div>

<button class="casino-btn" id="btnCasino">🎰</button>

<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';

const MAX_LEVEL = 120;
const MAX_CLICK_LVL = 200;
const MAX_CPS_LVL = 200;
const STAGES = [
  {c1:"#6b5a3f", c2:"#3a2f1e", c3:"#1a1510", ring:"#2a2218", sym:.15, hl:.20},
  {c1:"#8a6a48", c2:"#503820", c3:"#281a10", ring:"#3a2a18", sym:.17, hl:.25},
  {c1:"#a07048", c2:"#6d4525", c3:"#3a2410", ring:"#4a2e15", sym:.18, hl:.28},
  {c1:"#b87c50", c2:"#7c5028", c3:"#482c14", ring:"#5a3a1c", sym:.20, hl:.30},
  {c1:"#cc8858", c2:"#8b5028", c3:"#5a3010", ring:"#6a3e18", sym:.22, hl:.32},
  {c1:"#d4a060", c2:"#9a6830", c3:"#604018", ring:"#7a4e20", sym:.22, hl:.34},
  {c1:"#e0a060", c2:"#a06020", c3:"#603810", ring:"#8a5020", sym:.24, hl:.36},
  {c1:"#c8c8d0", c2:"#8888a0", c3:"#484858", ring:"#686880", sym:.25, hl:.38},
  {c1:"#d8d8e0", c2:"#9898a8", c3:"#585870", ring:"#787890", sym:.26, hl:.40},
  {c1:"#f0f0f8", c2:"#b0b0c8", c3:"#606078", ring:"#909098", sym:.28, hl:.45},
  {c1:"#ffe066", c2:"#d4a017", c3:"#8b6914", ring:"#c09010", sym:.30, hl:.45},
  {c1:"#ffd700", c2:"#b8860b", c3:"#78540a", ring:"#d0a020", sym:.32, hl:.48},
  {c1:"#ffe880", c2:"#e0b020", c3:"#9a7010", ring:"#e0b020", sym:.34, hl:.50, glow:25, gc:"#e0b020aa"},
  {c1:"#fff0a0", c2:"#f0c030", c3:"#a08020", ring:"#f0c030", sym:.36, hl:.52, glow:40, gc:"#f0c030"},
  {c1:"#ffee55", c2:"#e0a000", c3:"#a07000", ring:"#f0b020", sym:.38, hl:.54, glow:50, gc:"#f0c020"},
  {c1:"#f8e0c0", c2:"#d0a060", c3:"#806030", ring:"#e0b880", sym:.40, hl:.55, glow:55, gc:"#e8c890"},
  {c1:"#d0f0ff", c2:"#60b8e8", c3:"#2060a0", ring:"#a0d8f0", sym:.45, hl:.60, glow:60, gc:"#a0d8ff"},
  {c1:"#e0c0ff", c2:"#a060e8", c3:"#6028a8", ring:"#c090f0", sym:.48, hl:.62, glow:65, gc:"#c090ff"},
  {c1:"#ffb0b0", c2:"#e03060", c3:"#801030", ring:"#ff5070", sym:.52, hl:.65, glow:75, gc:"#ff5070"},
  {c1:"#ffb0d0", c2:"#ff3080", c3:"#a01050", ring:"#ff60a0", sym:.55, hl:.68, glow:80, gc:"#ff60a0"},
  {c1:"#b0ffe0", c2:"#20d090", c3:"#106050", ring:"#60ffb0", sym:.55, hl:.68, glow:85, gc:"#60ffb0"},
  {c1:"#e0f0ff", c2:"#4090ff", c3:"#103060", ring:"#80c0ff", sym:.58, hl:.70, glow:90, gc:"#80c0ff"},
  {c1:"#ffe0b0", c2:"#ff8000", c3:"#a04000", ring:"#ffa040", sym:.60, hl:.72, glow:95, gc:"#ffa040"},
  {rainbow:true}
];
const NUM_STAGES = STAGES.length;
const stageForLevel = lvl => Math.min(NUM_STAGES-1, Math.floor((Math.max(1,Math.min(MAX_LEVEL,lvl))-1)/(MAX_LEVEL/NUM_STAGES)));

const defaults = () => ({coins:0, perClick:1, cps:0, clickLvl:0, cpsLvl:0, level:1, version:0, infinite:false});

let S = defaults();
let token = localStorage.getItem("ruble_token") || "";
let username = localStorage.getItem("ruble_user") || "";
let dirty = false;
let authMode = "login";
let pushing = false;

const el = {
  auth: document.getElementById("authScreen"),
  game: document.getElementById("gameScreen"),
  authUser: document.getElementById("authUser"),
  authPass: document.getElementById("authPass"),
  authBtn: document.getElementById("authBtn"),
  authErr: document.getElementById("authErr"),
  authSwitch: document.getElementById("authSwitch"),
  authSub: document.getElementById("authSub"),
  hudUser: document.getElementById("hudUser"),
  coins: document.getElementById("coins"),
  cpsText: document.getElementById("cpsText"),
  coin: document.getElementById("coin"),
  coinArea: document.getElementById("coinArea"),
  levelNum: document.getElementById("levelNum"),
  progress: document.getElementById("progress"),
  shop: document.getElementById("btnShop"),
  badge: document.getElementById("shopBadge"),
  topBtn: document.getElementById("btnTop"),
  unionBtn: document.getElementById("btnUnion"),
  casinoBtn: document.getElementById("btnCasino"),
  broadcastBanner: document.getElementById("broadcastBanner"),
  broadcastText: document.getElementById("broadcastText"),
  broadcastClose: document.getElementById("broadcastClose"),
  toast: document.getElementById("toast"),
};

function api(url, opts={}){
  opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  return fetch(url, opts).then(r => r.json().then(j => ({status:r.status, data:j})));
}

function fmt(n){
  n = Math.floor(n);
  if (n < 1e6) return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  if (n < 1e9) return (n/1e6).toFixed(n<1e7?2:1).replace(/\.0+$/,"") + "M";
  if (n < 1e12) return (n/1e9).toFixed(2).replace(/\.0+$/,"") + "B";
  if (n < 1e15) return (n/1e12).toFixed(2).replace(/\.0+$/,"") + "T";
  return (n/1e15).toFixed(2) + "Q";
}

const PRICE_MULT = 1.10;
const costClick = () => Math.floor(10 * Math.pow(PRICE_MULT, S.clickLvl));
const costCps   = () => Math.floor(100 * Math.pow(PRICE_MULT, S.cpsLvl));
const costLevel = () => Math.floor(50 * Math.pow(S.level, 1.3)) + 50;

function applyStage(st){
  const c = el.coin;
  if (st.rainbow){
    c.classList.add("rainbow");
    ["--c1","--c2","--c3","--ring","--glow","--glow-color"].forEach(k => c.style.removeProperty(k));
    c.style.setProperty("--sym", .55);
    c.style.setProperty("--hl", .55);
  } else {
    c.classList.remove("rainbow");
    c.style.setProperty("--c1", st.c1);
    c.style.setProperty("--c2", st.c2);
    c.style.setProperty("--c3", st.c3);
    c.style.setProperty("--ring", st.ring);
    c.style.setProperty("--sym", st.sym || .2);
    c.style.setProperty("--hl", st.hl || .3);
    if (st.glow){ c.style.setProperty("--glow", st.glow + "px"); c.style.setProperty("--glow-color", st.gc); }
    else { c.style.setProperty("--glow", "0px"); c.style.setProperty("--glow-color", "transparent"); }
  }
}

function render(){
  if (S.infinite){
    el.coins.textContent = "∞";
    el.coins.classList.add("infinite");
  } else {
    el.coins.textContent = fmt(S.coins);
    el.coins.classList.remove("infinite");
  }
  el.cpsText.textContent = fmt(S.cps);
  el.levelNum.textContent = S.level;
  const perStage = MAX_LEVEL / NUM_STAGES;
  el.progress.style.width = (((S.level-1)%perStage)/perStage*100) + "%";
  applyStage(STAGES[stageForLevel(S.level)]);
  const canBuy = S.infinite || S.coins >= costClick() || S.coins >= costCps() || (S.level < MAX_LEVEL && S.coins >= costLevel());
  el.badge.style.display = canBuy ? "inline-block" : "none";
}

function floatText(text, x, y){
  const f = document.createElement("div");
  f.className = "float"; f.textContent = text;
  const r = el.coinArea.getBoundingClientRect();
  f.style.left = (x - r.left) + "px";
  f.style.top  = (y - r.top) + "px";
  el.coinArea.appendChild(f);
  setTimeout(()=>f.remove(), 900);
}

function doClick(x, y){
  S.coins += S.perClick;
  dirty = true;
  el.coin.classList.remove("tapping");
  void el.coin.offsetWidth;
  el.coin.classList.add("tapping");
  if (x != null) floatText("+" + fmt(S.perClick) + " ₽", x, y);
  if (navigator.vibrate) navigator.vibrate(8);
  render();
}

function toast(t){
  el.toast.textContent = t;
  el.toast.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.toast.classList.remove("show"), 1400);
}

el.coin.addEventListener("pointerdown", e => {
  e.preventDefault();
  const r = e.target.getBoundingClientRect();
  doClick(e.clientX || (r.left+r.width/2), e.clientY || (r.top+r.height/2));
});

/* ---- AUTH ---- */
function setAuthMode(m){
  authMode = m;
  if (m === "login"){
    el.authBtn.textContent = "Войти";
    el.authSwitch.textContent = "Создать аккаунт";
    el.authSub.textContent = "Войди в свой аккаунт";
  } else {
    el.authBtn.textContent = "Создать аккаунт";
    el.authSwitch.textContent = "У меня уже есть аккаунт";
    el.authSub.textContent = "Придумай ник и пароль";
  }
  el.authErr.textContent = "";
}
el.authSwitch.onclick = () => setAuthMode(authMode === "login" ? "register" : "login");

async function doAuth(){
  const u = el.authUser.value.trim();
  const p = el.authPass.value;
  el.authErr.textContent = "";
  if (!u || !p){ el.authErr.textContent = "Заполни все поля"; return; }
  el.authBtn.disabled = true;
  const url = authMode === "login" ? "/api/login" : "/api/register";
  const {data} = await api(url, {method:"POST", body: JSON.stringify({username:u, password:p})});
  el.authBtn.disabled = false;
  if (data.error){ el.authErr.textContent = data.error; return; }
  token = data.token;
  username = data.username;
  localStorage.setItem("ruble_token", token);
  localStorage.setItem("ruble_user", username);
  await enterGame();
}
el.authBtn.onclick = doAuth;
el.authPass.addEventListener("keypress", e => { if (e.key === "Enter") doAuth(); });

document.getElementById("btnLogout").onclick = async () => {
  if (!confirm("Выйти?")) return;
  await api("/api/logout", {method:"POST"});
  logoutLocal();
};

function logoutLocal(){
  localStorage.removeItem("ruble_token");
  localStorage.removeItem("ruble_user");
  token = ""; username = "";
  el.game.classList.remove("active");
  el.topBtn.classList.remove("active");
  el.unionBtn.classList.remove("active");
  el.casinoBtn.classList.remove("active");
  el.auth.style.display = "flex";
  setAuthMode("login");
}

async function enterGame(){
  el.auth.style.display = "none";
  el.game.classList.add("active");
  el.topBtn.classList.add("active");
  el.unionBtn.classList.add("active");
  el.casinoBtn.classList.add("active");
  el.hudUser.textContent = username;
  const {data} = await api("/api/state");
  if (data.error){ logoutLocal(); return; }
  S = Object.assign(defaults(), data);
  render();
  pollBroadcast();
}

/* ---- SYNC ---- */
async function fetchState(){
  if (!token) return;
  const {status, data} = await api("/api/state");
  if (status === 401){ logoutLocal(); return; }
  if (!data.error && !dirty && (data.version||0) > (S.version||0)){
    S = Object.assign(defaults(), data);
    render();
  }
}
async function pushState(){
  if (!token || !dirty || pushing) return;
  pushing = true;
  dirty = false;
  try {
    const {status, data} = await api("/api/save", {
      method:"POST",
      body: JSON.stringify({
        coins: S.coins, perClick: S.perClick, cps: S.cps,
        clickLvl: S.clickLvl, cpsLvl: S.cpsLvl, level: S.level,
        version: S.version
      })
    });
    if (status === 401){ logoutLocal(); return; }
    if (data.conflict){ await fetchState(); }
    else if (data.version){ S.version = data.version; }
  } catch(e){
    dirty = true;
  } finally {
    pushing = false;
  }
}

/* ---- SHOP ---- */
function openShop(){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal-sheet bottom" id="shopSheet">
      <span class="modal-close" id="shopClose">×</span>
      <h3>🛒 Магазин</h3>
      <div id="shopUpgrades">
      <div class="up-row" id="up-click" data-act="click">
        <div class="up-icon">👆</div>
        <div class="up-body">
          <div class="up-name">Улучшить клик</div>
          <div class="up-desc">+1 ₽ к тапу</div>
          <div class="up-lvl" id="lvl-click"></div>
        </div>
        <div class="up-cost" id="c-click"></div>
      </div>
      <div class="up-row" id="up-cps" data-act="cps">
        <div class="up-icon">⚡</div>
        <div class="up-body">
          <div class="up-name">Доход в секунду</div>
          <div class="up-desc">+1 ₽/сек автоматически</div>
          <div class="up-lvl" id="lvl-cps"></div>
        </div>
        <div class="up-cost" id="c-cps"></div>
      </div>
      <div class="up-row" id="up-level" data-act="level">
        <div class="up-icon">✨</div>
        <div class="up-body">
          <div class="up-name">Полировать монету</div>
          <div class="up-desc">Монета выглядит дороже</div>
          <div class="up-lvl" id="lvl-text"></div>
        </div>
        <div class="up-cost" id="c-level"></div>
      </div>
      </div>
    </div>`;
  document.body.appendChild(bg);

  function refresh(){
    document.getElementById("lvl-click").innerHTML = `Ур. ${S.clickLvl}/${MAX_CLICK_LVL} · сейчас +${S.perClick} ₽`;
    document.getElementById("lvl-cps").innerHTML = `Ур. ${S.cpsLvl}/${MAX_CPS_LVL} · сейчас ${S.cps} ₽/сек`;
    const st = stageForLevel(S.level)+1;
    document.getElementById("lvl-text").innerHTML = `Ур. ${S.level}/${MAX_LEVEL} · стадия ${st}/${NUM_STAGES}`;
    const cc = costClick(), cp = costCps(), cl = costLevel();
    document.getElementById("c-click").textContent = fmt(cc) + " ₽";
    document.getElementById("c-cps").textContent   = fmt(cp) + " ₽";
    document.getElementById("c-level").textContent = S.level >= MAX_LEVEL ? "MAX" : fmt(cl) + " ₽";
    const inf = S.infinite;
    document.getElementById("up-click").classList.toggle("disabled", S.clickLvl >= MAX_CLICK_LVL || (!inf && S.coins < cc));
    document.getElementById("up-cps").classList.toggle("disabled", S.cpsLvl >= MAX_CPS_LVL || (!inf && S.coins < cp));
    document.getElementById("up-level").classList.toggle("disabled", S.level >= MAX_LEVEL || (!inf && S.coins < cl));
    document.getElementById("c-click").classList.toggle("off", !inf && S.clickLvl < MAX_CLICK_LVL && S.coins < cc);
    document.getElementById("c-cps").classList.toggle("off", !inf && S.cpsLvl < MAX_CPS_LVL && S.coins < cp);
    document.getElementById("c-level").classList.toggle("off", !inf && S.level < MAX_LEVEL && S.coins < cl);
    document.getElementById("c-click").textContent = S.clickLvl >= MAX_CLICK_LVL ? "MAX" : fmt(cc) + " ₽";
    document.getElementById("c-cps").textContent   = S.cpsLvl >= MAX_CPS_LVL ? "MAX" : fmt(cp) + " ₽";
  }

  document.getElementById("shopClose").onclick = () => bg.remove();

  const sheet = document.getElementById("shopSheet");
  sheet.addEventListener("pointerdown", e => {
    const row = e.target.closest(".up-row");
    if (!row) return;
    e.preventDefault(); e.stopPropagation();
    if (row.classList.contains("disabled")){ toast("Не хватает ₽"); return; }
    const act = row.dataset.act;
    if (act === "click"){
      if (S.clickLvl >= MAX_CLICK_LVL) return toast("Клик на максимуме!");
      const c = costClick();
      if (!S.infinite && S.coins < c) return toast("Не хватает ₽");
      if (!S.infinite) S.coins -= c;
      S.clickLvl++; S.perClick++; dirty = true;
    } else if (act === "cps"){
      if (S.cpsLvl >= MAX_CPS_LVL) return toast("Автокликер на максимуме!");
      const c = costCps();
      if (!S.infinite && S.coins < c) return toast("Не хватает ₽");
      if (!S.infinite) S.coins -= c;
      S.cpsLvl++; S.cps++; dirty = true;
    } else if (act === "level"){
      if (S.level >= MAX_LEVEL) return toast("Максимум!");
      const c = costLevel();
      if (!S.infinite && S.coins < c) return toast("Не хватает ₽");
      if (!S.infinite) S.coins -= c;
      S.level++; S.perClick++; dirty = true;
      if (S.level === MAX_LEVEL) toast("🏆 ЛЕГЕНДАРНАЯ МОНЕТА!");
    }
    row.classList.add("flash");
    setTimeout(()=>row.classList.remove("flash"), 180);
    if (navigator.vibrate) navigator.vibrate(6);
    render(); refresh();
  });

  bg.addEventListener("pointerdown", e => { if (e.target === bg) bg.remove(); });
  refresh();
}

async function openTop(){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal-sheet">
      <span class="modal-close" id="topClose">×</span>
      <h3>🏆 Топ игроков</h3>
      <div id="topList"><div class="loading">Загрузка...</div></div>
    </div>`;
  document.body.appendChild(bg);

  let timer = null;
  let stopped = false;

  const renderTop = (data) => {
    const list = document.getElementById("topList");
    if (!list) return;
    if (!Array.isArray(data) || !data.length){
      list.innerHTML = `<div class="loading">Пока никого нет</div>`;
      return;
    }
    // сохраняем позицию скролла
    const scroll = list.scrollTop;
    list.innerHTML = data.map((u, i) => {
      const place = i+1;
      let cls = "";
      let medal = place;
      if (place === 1){ cls = "gold"; medal = "🥇"; }
      else if (place === 2){ cls = "silver"; medal = "🥈"; }
      else if (place === 3){ cls = "bronze"; medal = "🥉"; }
      const color = ["#e17076","#7bc862","#e5ca77","#65aadd","#a695e7","#ee7aae","#6ec9cb","#faa774"][u.username.charCodeAt(0)%8];

        <div class="t-avatar" style="background:${color}">${u.username[0].toUpperCase()}</div>

        </div>
        <div class="t-coins">${fmt(u.coins)} ₽</div>
      </div>`;
    }).join("");
    list.scrollTop = scroll;
    list.querySelectorAll(".top-row").forEach(r => {
      r.onclick = () => {
        if (stopped) return;
        stopped = true;
        clearInterval(timer);
        bg.remove();
        openProfile(decodeURIComponent(r.dataset.user));
      };
    });
  };

  const refreshTop = async () => {
    if (stopped) return;
    const {data} = await api("/api/top");
    if (!stopped) renderTop(data);
  };

  const closeMe = () => {
    stopped = true;
    clearInterval(timer);
    bg.remove();
  };

  document.getElementById("topClose").onclick = closeMe;
  bg.addEventListener("pointerdown", e => { if (e.target === bg) closeMe(); });

  await refreshTop();
  timer = setInterval(refreshTop, 2500);
}

async function openUnionInfo(uid){
  const bg = document.createElement("div");

    <div class="modal-sheet">
      <span class="modal-close" id="uiClose">×</span>

  bg.addEventListener("pointerdown", e => { if (e.target === bg) closeMe(); });

  let myUnionId = null;
  const render = (u, myId) => {
    const body = document.getElementById("uiBody");
    if (!body) return;
    if (u.error){ body.innerHTML = `<div class="loading">Союз не найден</div>`; return; }
    myUnionId = myId;
    const inThis = (myId === u.id);

      <div class="top-row" style="cursor:default">
        <div class="t-avatar" style="background:${u.color}">${m.username[0].toUpperCase()}</div>

    body.querySelectorAll("[data-kick]").forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        kickMember(b.dataset.kick, uid, () => { closeMe(); openUnionInfo(uid); });
      };
    });

    body.querySelectorAll("[data-kick]").forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        kickMember(b.dataset.kick, uid, () => { closeMe(); openUnionInfo(uid); });
      };
    });

    const jb = document.getElementById("uiJoin");
    if (jb) jb.onclick = async () => {
      const {data} = await api("/api/unions/join", {method:"POST", body: JSON.stringify({id: u.id})});
      if (data.error) return toast(data.error);
      toast("Вступил в союз!");
      closeMe();

    if (lb) lb.onclick = async () => {
      if (!confirm("Выйти из союза?")) return;

      toast("Покинул союз");
      closeMe();

      api("/api/unions")

let casinoTab = "coin";
function openCasino(){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="casino-modal">
      <span class="modal-close" id="casClose">×</span>
      <h3>🎰 КАЗИНО</h3>
      <div class="casino-balance">Баланс: <b id="casBal">${S.infinite ? "∞" : fmt(S.coins) + " ₽"}</b></div>
      <div class="casino-tabs">
        <div class="casino-tab ${casinoTab==='coin'?'active':''}" data-tab="coin">🪙 Монетка</div>
        <div class="casino-tab ${casinoTab==='dice'?'active':''}" data-tab="dice">🎲 Кости</div>
      </div>

      <div class="casino-section ${casinoTab==='coin'?'active':''}" data-sec="coin">
        <div class="casino-coin" id="casCoin">₽</div>
        <input class="casino-input" id="casBet" placeholder="Ставка" inputmode="numeric">
        <div class="casino-quick">
          <button data-q="100">100</button>

          <button data-q="all">ВСЁ</button>
        </div>
        <button class="casino-action flip" id="casHeads">🟡 Орёл (x2)</button>
        <button class="casino-action flip" id="casTails">⚪ Решка (x2)</button>
        <div class="casino-result" id="casResCoin"></div>
      </div>

      <div class="casino-section ${casinoTab==='dice'?'active':''}" data-sec="dice">
        <div class="casino-dice" id="casDice">⚀</div>
        <input class="casino-input" id="diceBet" placeholder="Ставка" inputmode="numeric">
        <div class="casino-quick">
          <button data-q2="100">100</button>
          <button data-q2="1000">1K</button>
          <button data-q2="10000">10K</button>
          <button data-q2="all2">ВСЁ</button>
        </div>
        <button class="casino-action coin" id="diceRoll">🎲 Бросить кубик</button>
        <div style="text-align:center;color:#8888aa;font-size:12px;margin-top:8px">
          6 — x3 &nbsp;·&nbsp; 5 — x2 &nbsp;·&nbsp; 4 — возврат &nbsp;·&nbsp; 1-3 — проигрыш
        </div>
        <div class="casino-result" id="casResDice"></div>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const closeMe = () => bg.remove();
  document.getElementById("casClose").onclick = closeMe;
  bg.addEventListener("pointerdown", e => { if (e.target === bg) closeMe(); });

  // табы
  bg.querySelectorAll(".casino-tab").forEach(t => {
    t.onclick = () => {
      casinoTab = t.dataset.tab;
      bg.querySelectorAll(".casino-tab").forEach(x => x.classList.toggle("active", x.dataset.tab === casinoTab));
      bg.querySelectorAll(".casino-section").forEach(x => x.classList.toggle("active", x.dataset.sec === casinoTab));
    };
  });

  // быстрые кнопки
  bg.querySelectorAll("[data-q]").forEach(b => {
    b.onclick = () => {
      const v = b.dataset.q;
      document.getElementById("casBet").value = v === "all" ? Math.floor(S.coins) : v;
    };
  });
  bg.querySelectorAll("[data-q2]").forEach(b => {
    b.onclick = () => {
      const v = b.dataset.q2;
      document.getElementById("diceBet").value = v === "all2" ? Math.floor(S.coins) : v;
    };
  });

  const updBal = () => {
    document.getElementById("casBal").textContent = S.infinite ? "∞" : fmt(S.coins) + " ₽";
  };

  // МОНЕТКА
  const flip = async (choice) => {
    const betStr = document.getElementById("casBet").value.trim();
    const bet = parseInt(betStr);
    if (!bet || bet <= 0) return toast("Введи ставку");
    if (!S.infinite && bet > S.coins) return toast("Не хватает монет");
    const coin = document.getElementById("casCoin");
    coin.classList.remove("flipping");
    void coin.offsetWidth;
    coin.classList.add("flipping");
    const res = document.getElementById("casResCoin");
    res.style.display = "none";

    const {data} = await api("/api/casino/flip", {method:"POST", body: JSON.stringify({bet, choice})});
    setTimeout(() => {
      if (data.error){ toast(data.error); return; }
      coin.textContent = data.result === "heads" ? "🟡" : "⚪";
      if (data.win){
        S.coins += data.bet; dirty = true;
        res.textContent = "🎉 ПОБЕДА! +" + fmt(data.bet) + " ₽";
        res.className = "casino-result win";
      } else {
        if (!S.infinite) S.coins -= data.bet;
        dirty = true;
        res.textContent = "😔 Проигрыш -" + fmt(data.bet) + " ₽";
        res.className = "casino-result lose";
      }
      res.style.display = "block";
      render(); updBal();
    }, 1000);
  };
  document.getElementById("casHeads").onclick = () => flip("heads");
  document.getElementById("casTails").onclick = () => flip("tails");

  // КОСТИ
  document.getElementById("diceRoll").onclick = async () => {
    const betStr = document.getElementById("diceBet").value.trim();
    const bet = parseInt(betStr);
    if (!bet || bet <= 0) return toast("Введи ставку");
    if (!S.infinite && bet > S.coins) return toast("Не хватает монет");
    const dice = document.getElementById("casDice");
    dice.classList.remove("rolling");
    void dice.offsetWidth;
    dice.classList.add("rolling");
    const res = document.getElementById("casResDice");
    res.style.display = "none";

    const {data} = await api("/api/casino/dice", {method:"POST", body: JSON.stringify({bet})});
    setTimeout(() => {
      if (data.error){ toast(data.error); return; }
      const faces = {1:"⚀",2:"⚁",3:"⚂",4:"⚃",5:"⚄",6:"⚅"};
      dice.textContent = faces[data.roll];
      const delta = data.bet * data.mult - data.bet;
      if (!S.infinite) S.coins += delta;
      dirty = true;
      if (data.mult > 1){
        res.textContent = "Выпало " + data.roll + " — x" + data.mult + "! +" + fmt(delta) + " ₽";
        res.className = "casino-result win";
      } else if (data.mult === 1){
        res.textContent = "Выпало " + data.roll + " — возврат ставки";
        res.className = "casino-result win";
      } else {
        res.textContent = "Выпало " + data.roll + " — -" + fmt(data.bet) + " ₽";
        res.className = "casino-result lose";
      }
      res.style.display = "block";
      render(); updBal();
    }, 800);
  };
}

/* ---- SKINS IN SHOP ---- */
function shopTabSwitch(bg, tab){
  bg.querySelectorAll(".shop-tab").forEach(x => x.classList.toggle("active", x.dataset.tab === tab));
  document.getElementById("shopUpgrades").style.display = tab === "upgrades" ? "block" : "none";
  document.getElementById("shopSkins").style.display = tab === "skins" ? "block" : "none";
  if (tab === "skins") loadSkins(bg);
}

async function loadSkins(bg){
  const el = document.getElementById("skinsList");
  if (!el) return;
  el.innerHTML = `<div class="loading">Загрузка...</div>`;
  const {data} = await api("/api/skins");
  if (data.error){ el.innerHTML = `<div class="loading">Ошибка</div>`; return; }
  const {my_skin, owned, catalog} = data;
  const ids = Object.keys(catalog);
  el.innerHTML = `<div class="skins-grid">` + ids.map(id => {
    const sk = catalog[id];
    const isOwned = owned.includes(id);
    const isSel = my_skin === id;
    let priceHtml;
    if (isSel) priceHtml = `<div class="skin-price selected-tag">✓ Выбран</div>`;
    else if (isOwned) priceHtml = `<div class="skin-price owned-tag">Куплен</div>`;
    else priceHtml = `<div class="skin-price">${fmt(sk.price)} ₽</div>`;
    return `<div class="skin-card ${isOwned?'owned':''} ${isSel?'selected':''}" data-skin="${id}">
      <div class="skin-preview skin-${id}">₽</div>
      <div class="skin-name">${sk.emoji} ${sk.name}</div>
      ${priceHtml}
    </div>`;
  }).join("") + `</div>`;

  el.querySelectorAll(".skin-card").forEach(card => {
    card.onclick = async () => {
      const id = card.dataset.skin;
      const sk = catalog[id];
      const isOwned = owned.includes(id);
      if (isOwned){
        if (my_skin === id) return;
        const {data} = await api("/api/skins/select", {method:"POST", body: JSON.stringify({skin_id: id})});
        if (data.error) return toast(data.error);
        toast("Скин выбран: " + sk.name);
        loadSkins(bg);
      } else {
        if (!S.infinite && S.coins < sk.price) return toast("Не хватает монет");
        if (!confirm("Купить " + sk.name + " за " + fmt(sk.price) + " ₽?")) return;
        const {data} = await api("/api/skins/buy", {method:"POST", body: JSON.stringify({skin_id: id})});
        if (data.error) return toast(data.error);
        if (!S.infinite){ S.coins -= sk.price; dirty = true; render(); }
        toast("Куплено: " + sk.name);
        loadSkins(bg);
      }
    };
  });
}

/* ---- BANNERS ---- */
const BANNER_EMOJIS = ["\U0001f451","\U0001f4a0","\U0001f525","\u2b50","\U0001f48e","\U0001f680","\U0001f30c","\U0001f308","\u26a1","\U0001f3c6","\U0001f4b0","\U0001f9e0"];
const BANNER_COLORS = ["#e17076","#7bc862","#e5ca77","#65aadd","#a695e7","#ee7aae","#6ec9cb","#faa774","#ff9d5c","#d4262a"];

async function loadBanners(username, container, isOwner){
  const {data} = await api("/api/banners/" + encodeURIComponent(username));
  if (!Array.isArray(data)) return;
  const bySlot = {};
  data.forEach(b => bySlot[b.slot] = b);
  container.innerHTML = "";
  for (let i = 1; i <= 6; i++){
    const b = bySlot[i];
    const div = document.createElement("div");
    div.className = "banner-slot " + (b ? "filled" : "empty");
    if (b){
      div.style.background = `radial-gradient(circle at 32% 28%, ${b.color}dd, ${b.color}88 70%, ${b.color}44)`;
      div.innerHTML = `
        <div class="b-emoji">${b.emoji}</div>
        ${b.label?`<div class="b-label">${b.label}</div>`:""}
        ${isOwner?`<div class="b-del" data-slot="${i}">×</div>`:""}
      `;
    } else {
      div.innerHTML = isOwner ? `<div class="b-emoji" style="opacity:.3">+</div>` : "";
    }
    if (isOwner){
      div.onclick = (e) => {
        if (e.target.classList.contains("b-del")){
          e.stopPropagation();
          deleteBanner(i, username, container, isOwner);
        } else {
          openBannerEditor(i, username, container, isOwner);
        }
      };
    }
    container.appendChild(div);
  }
}

async function deleteBanner(slot, username, container, isOwner){
  const {data} = await api("/api/banners/" + slot, {method:"DELETE"});
  if (data.ok) loadBanners(username, container, isOwner);
}

function openBannerEditor(slot, username, container, isOwner){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal-sheet" style="max-width:380px">
      <span class="modal-close" id="beClose">×</span>
      <h3>Баннер #${slot}</h3>
      <div class="admin-section-title">Эмодзи</div>
      <div class="banner-editor-emoji" id="beEmojis">
        ${BANNER_EMOJIS.map((e,i) => `<button data-emoji="${e}" data-i="${i}">${e}</button>`).join("")}
      </div>
      <div class="admin-section-title">Цвет</div>
      <div class="banner-editor-color" id="beColors">
        ${BANNER_COLORS.map(c => `<button data-color="${c}" style="background:${c}"></button>`).join("")}
      </div>
      <div class="admin-section-title">Подпись (необязательно)</div>
      <input class="union-search" id="beLabel" maxlength="40" placeholder="Например: Топ-1">
      <button class="union-create-btn" id="beSave">Сохранить</button>
      <div id="beErr" style="color:#e17076;text-align:center;font-size:13px;min-height:18px"></div>
    </div>`;
  document.body.appendChild(bg);
  let selEmoji = BANNER_EMOJIS[0];
  let selColor = BANNER_COLORS[0];

  bg.querySelector("#beEmojis").querySelectorAll("button").forEach(b => {
    if (b.dataset.i === "0") b.classList.add("active");
    b.onclick = () => {
      bg.querySelectorAll("#beEmojis button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      selEmoji = b.dataset.emoji;
    };
  });
  bg.querySelector("#beColors").querySelectorAll("button").forEach((b,i) => {
    if (i === 0) b.classList.add("active");
    b.onclick = () => {
      bg.querySelectorAll("#beColors button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      selColor = b.dataset.color;
    };
  });

  const closeMe = () => bg.remove();
  bg.querySelector("#beClose").onclick = closeMe;
  bg.addEventListener("pointerdown", e => { if (e.target === bg) closeMe(); });

  bg.querySelector("#beSave").onclick = async () => {
    const label = bg.querySelector("#beLabel").value.trim();
    const {data} = await api("/api/banners", {method:"POST", body: JSON.stringify({
      slot, emoji: selEmoji, color: selColor, label
    })});
    if (data.error){ bg.querySelector("#beErr").textContent = data.error; return; }
    closeMe();
    loadBanners(username, container, isOwner);
  };
}

/* ---- KICK ---- */
async function kickMember(targetUsername, unionId, onDone){
  if (!confirm("Кикнуть " + targetUsername + "?")) return;
  const {data} = await api("/api/unions/kick", {method:"POST", body: JSON.stringify({username: targetUsername})});
  if (data.error) return toast(data.error);
  toast("Кикнут: " + targetUsername);
  if (onDone) onDone();
}
